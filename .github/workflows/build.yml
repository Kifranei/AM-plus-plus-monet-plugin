name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify host references
        run: python3 -B scripts/verify-sdk.py
      - name: Verify shipped host profiles (APKs are not available in CI; versions without one are skipped)
        run: python3 -B scripts/verify-all-profiles.py
      - name: Build and test
        run: ./gradlew :monet-plugin:testDebugUnitTest :monet-plugin:lintDebug :monet-plugin:pluginZip --no-daemon
      - name: Verify plugin ZIP
        run: |
          version=$(python3 -c 'import json; print(json.load(open("monet-plugin/plugin.json"))["versionName"])')
          python3 -B scripts/verify-monet-plugin.py "monet-plugin/build/dist/ampp-monet-cover-color-${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ampp-monet-cover-color
          path: monet-plugin/build/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            monet-plugin/build/reports/tests/
            monet-plugin/build/reports/lint-results-debug.*
